---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 9999
    schedule:
      interval: weekly
    assignees:
      - marekdedic
  - package-ecosystem: npm
    directory: "/"
    open-pull-requests-limit: 9999
    schedule:
      interval: weekly
    assignees:
      - marekdedic
  - package-ecosystem: composer
    directory: "/"
    open-pull-requests-limit: 9999
    schedule:
      interval: weekly
    assignees:
      - marekdedic
    # Newer versions of these runtime dependencies drop support for PHP 5.6
    ignore:
      - dependency-name: google/apiclient
        versions: [">=2.15.0"]
      - dependency-name: google/apiclient-services
        versions: [">=0.303.0"]
      - dependency-name: google/auth
        versions: [">=1.20.0"]
      - dependency-name: guzzlehttp/guzzle
        versions: [">=7.0.0"]
      - dependency-name: guzzlehttp/promises
        versions: [">=2.0.0"]
      - dependency-name: monolog/monolog
        versions: [">=2.0.0"]
      - dependency-name: paragonie/constant_time_encoding
        versions: [">=2.0.0"]
      - dependency-name: paragonie/random_compat
        versions: [">=9.0.0"]
      - dependency-name: psr/cache
        versions: [">=2.0.0"]
      - dependency-name: psr/http-message
        versions: [">=1.1.0"]
      - dependency-name: symfony/polyfill-intl-idn
        versions: [">=1.20.0"]
      - dependency-name: symfony/polyfill-intl-normalizer
        versions: [">=1.20.0"]
      - dependency-name: symfony/polyfill-php70
        versions: [">=1.20.0"]
      - dependency-name: symfony/polyfill-php72
        versions: [">=1.20.0"]
